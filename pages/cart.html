<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<title>Cart | Stylex</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-page="cart" data-root="../">
<div id="site-header"></div>
<main class="section"><div class="container">
  <h1 class="mb-4">Your cart</h1>
  <div id="cartEmpty" class="d-none"><p class="fs-5">Your cart is empty. Add something you like to get started.</p>
    <a href="shop.html" class="btn btn-stylex">Go to shop</a></div>
  <div id="cartContent" class="row g-4 d-none">
    <div class="col-lg-8"><div id="cartItems" class="d-grid gap-3"></div></div>
    <div class="col-lg-4"><aside class="summary-box" aria-label="Cart summary">
      <h2 class="h4">Summary</h2>
      <div class="d-flex justify-content-between"><span>Total items</span><strong id="totalQty">0</strong></div>
      <div class="d-flex justify-content-between fs-5 my-2"><span>Total price</span><strong id="totalPrice">₱0</strong></div>
      <a href="checkout.html" class="btn btn-stylex w-100 mb-2">Proceed to checkout</a>
      <a href="shop.html" class="btn btn-outline-stylex w-100">Continue shopping</a></aside></div>
  </div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script></body></html>
