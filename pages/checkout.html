<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<title>Checkout | Stylex</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-page="checkout" data-root="../">
<div id="site-header"></div>
<main class="section"><div class="container">
  <h1 class="mb-4">Checkout</h1>
  <div id="checkoutEmpty" class="d-none"><p class="fs-5">There is nothing to check out. Your cart is empty.</p><a href="shop.html" class="btn btn-stylex">Go to shop</a></div>
  <div id="successMsg" class="d-none alert alert-success" role="alert">
    <h2 class="h4">Thank you! Your demo order was placed.</h2>
    <p class="mb-2">Order number: <strong id="orderNo"></strong>. No real payment was made and nothing will be delivered.</p>
    <a href="shop.html" class="btn btn-stylex">Back to shop</a></div>
  <div id="checkoutContent" class="row g-4">
    <div class="col-lg-7"><form id="checkoutForm" novalidate>
      <div class="mb-3"><label for="fullName" class="form-label fw-bold">Full name</label>
        <input id="fullName" name="fullName" type="text" class="form-control" autocomplete="name" required><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label for="email" class="form-label fw-bold">Email address</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label for="phone" class="form-label fw-bold">Phone number</label>
        <input id="phone" name="phone" type="tel" class="form-control" autocomplete="tel" placeholder="09123456789" required><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label for="address" class="form-label fw-bold">Delivery address</label>
        <textarea id="address" name="address" rows="3" class="form-control" autocomplete="street-address" required></textarea><div class="invalid-feedback"></div></div>
      <fieldset class="mb-3"><legend class="form-label fw-bold fs-6">Payment method (demo only)</legend>
        <div class="form-check"><input class="form-check-input" type="radio" name="payment" id="payCod" value="cod"><label class="form-check-label" for="payCod">Cash on delivery</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="payment" id="payGcash" value="gcash"><label class="form-check-label" for="payGcash">GCash (demo)</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="payment" id="payCard" value="card"><label class="form-check-label" for="payCard">Credit card (demo)</label></div>
        <div id="paymentError" class="invalid-feedback d-none">Choose a payment method.</div></fieldset>
      <button type="submit" class="btn btn-stylex btn-lg">Place demo order</button>
    </form></div>
    <div class="col-lg-5"><aside class="summary-box" aria-label="Order summary"><h2 class="h4">Order summary</h2>
      <ul id="orderSummary" class="list-unstyled mb-2"></ul>
      <div class="d-flex justify-content-between fs-5 border-top pt-2"><span>Total</span><strong id="summaryTotal">₱0</strong></div></aside></div>
  </div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script></body></html>
