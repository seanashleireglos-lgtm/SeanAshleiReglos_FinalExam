<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<title>Shop | Stylex</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-page="shop" data-root="../">
<div id="site-header"></div>
<main class="section"><div class="container">
  <h1 class="mb-4">Shop</h1>
  <div class="row g-3 mb-3">
    <div class="col-md-7"><label for="search" class="form-label fw-bold">Search by name</label>
      <input id="search" type="search" class="form-control" placeholder="Try &quot;hoodie&quot;"></div>
    <div class="col-md-3 col-8"><label for="sort" class="form-label fw-bold">Sort by</label>
      <select id="sort" class="form-select"><option value="default">Featured</option><option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option><option value="az">Name: A–Z</option></select></div>
    <div class="col-md-2 col-4 d-flex align-items-end"><button id="resetBtn" type="button" class="btn btn-outline-stylex w-100">Reset</button></div>
  </div>
  <div id="categoryButtons" class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Filter by category"></div>
  <p id="resultCount" class="text-soft" aria-live="polite"></p>
  <div class="row g-3" id="productGrid"></div>
  <p id="noResults" class="d-none fs-5 mt-4">No products match your search. Try another name or press Reset.</p>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script></body></html>
